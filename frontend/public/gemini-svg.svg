<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 90 430 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Purple Character (Back Left) -->
  <g id="purple-character">
    <rect x="155" y="100" width="135" height="300" fill="#6B26FF"/>
    <!-- Left Eye -->
    <circle cx="225" cy="120" r="6" fill="#FFFFFF"/>
    <circle cx="225" cy="120" r="2.5" fill="#1E2022"/>
    <!-- Nose/Mouth Vertical Line -->
    <line x1="247" y1="116" x2="247" y2="142" stroke="#1E2022" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Eye -->
    <circle cx="269" cy="120" r="6" fill="#FFFFFF"/>
    <circle cx="269" cy="120" r="2.5" fill="#1E2022"/>
  </g>

  <!-- Dark Grey/Black Character (Back Right) -->
  <g id="dark-character">
    <rect x="260" y="188" width="90" height="212" fill="#1E2022"/>
    <!-- Left Eye (Peeking out to the right) -->
    <circle cx="327" cy="216" r="6" fill="#FFFFFF"/>
    <circle cx="327" cy="216" r="2.5" fill="#1E2022"/>
    <!-- Right Eye -->
    <circle cx="347" cy="216" r="6" fill="#FFFFFF"/>
    <circle cx="347" cy="216" r="2.5" fill="#1E2022"/>
  </g>

  <!-- Orange Character (Front Left Semi-circle Blob) -->
  <g id="orange-character">
    <path d="M 55 400 A 125 125 0 0 1 305 400 Z" fill="#FF7A29"/>
    <!-- Left Eye -->
    <circle cx="178" cy="356" r="5.5" fill="#1E2022"/>
    <!-- Smile -->
    <path d="M 196 362 A 12 12 0 0 0 220 362 Z" fill="#1E2022"/>
    <!-- Right Eye -->
    <circle cx="238" cy="356" r="5.5" fill="#1E2022"/>
  </g>

  <!-- Yellow Character (Front Right Pill/Arch Shape) -->
  <g id="yellow-character">
    <path d="M 330 400 L 330 300 A 55 55 0 0 1 440 300 L 440 400 Z" fill="#F0C714"/>
    <!-- Eye -->
    <circle cx="367" cy="282" r="4.5" fill="#1E2022"/>
    <!-- Horizontal Beak/Line -->
    <line x1="382" y1="300" x2="460" y2="300" stroke="#1E2022" stroke-width="5" stroke-linecap="square"/>
  </g>
</svg>
