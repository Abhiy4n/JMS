name: TypeScript backend

on:
  pull_request:
    paths:
      - "backend-js/**"
      - ".github/workflows/backend-js.yml"
  push:
    paths:
      - "backend-js/**"
      - ".github/workflows/backend-js.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-js

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        run: npm run check

      - name: Build backend
        run: npm run build
